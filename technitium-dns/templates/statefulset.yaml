apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "technitium-dns.fullname" . }}
  labels:
    {{- include "technitium-dns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "technitium-dns.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "technitium-dns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "technitium-dns.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "technitium-dns.serviceAccountName" . }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.clustering.enabled .Values.clustering.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if and .Values.clustering.enabled (gt (int .Values.replicaCount) 1) }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        podAntiAffinity:
          {{- if .Values.clustering.hostNetwork }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "technitium-dns.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
          {{- else if .Values.clustering.podAntiAffinity }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "technitium-dns.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
          {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if and .Values.clustering.enabled .Values.clustering.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.clustering.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.clustering.enabled }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DNS_SERVER_DOMAIN
              value: "$(POD_NAME).{{ include "technitium-dns.fullname" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local"
            {{- else }}
            - name: DNS_SERVER_DOMAIN
              value: {{ .Values.serverDomain | quote }}
            {{- end }}
            {{- if and .Values.admin.enabled .Values.admin.password }}
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "technitium-dns.password-secret" . }}
                  key: password
            {{- else if and .Values.admin.enabled .Values.admin.existingSecret }}
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret }}
                  key: password
            {{- end }}
            - name: DNS_SERVER_PREFER_IPV6
              value: {{ .Values.dnsConfig.preferIPv6 | quote }}
            - name: DNS_SERVER_WEB_SERVICE_HTTP_PORT
              value: {{ .Values.webConsole.httpPort | quote }}
            {{- if or .Values.webConsole.enableHttps .Values.clustering.enabled }}
            - name: DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS
              value: "true"
            - name: DNS_SERVER_WEB_SERVICE_HTTPS_PORT
              value: {{ .Values.webConsole.httpsPort | quote }}
            - name: DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT
              value: "true"
            {{- end }}
            {{- if .Values.webConsole.localAddresses }}
            - name: DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES
              value: {{ .Values.webConsole.localAddresses | quote }}
            {{- end }}
            {{- if .Values.dnsConfig.recursion }}
            - name: DNS_SERVER_RECURSION
              value: {{ .Values.dnsConfig.recursion | quote }}
            {{- end }}
            {{- if .Values.dnsConfig.enableBlocking }}
            - name: DNS_SERVER_ENABLE_BLOCKING
              value: "true"
            {{- end }}
            {{- if .Values.dnsConfig.allowTxtBlockingReport }}
            - name: DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT
              value: "true"
            {{- end }}
            {{- if .Values.dnsConfig.blockListUrls }}
            - name: DNS_SERVER_BLOCK_LIST_URLS
              value: {{ .Values.dnsConfig.blockListUrls | quote }}
            {{- end }}
            {{- if .Values.dnsConfig.forwarders }}
            - name: DNS_SERVER_FORWARDERS
              value: {{ .Values.dnsConfig.forwarders | quote }}
            {{- end }}
            {{- if .Values.dnsConfig.forwarderProtocol }}
            - name: DNS_SERVER_FORWARDER_PROTOCOL
              value: {{ .Values.dnsConfig.forwarderProtocol | quote }}
            {{- end }}
            {{- if .Values.dnsConfig.logUsingLocalTime }}
            - name: DNS_SERVER_LOG_USING_LOCAL_TIME
              value: "true"
            {{- end }}
            {{- if and .Values.serviceDoh.enabled .Values.serviceDoh.reverseProxy.enabled }}
            - name: DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP
              value: "true"
            {{- end }}
            {{- range $key, $value := .Values.extraEnvVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web-http
              containerPort: {{ .Values.webConsole.httpPort }}
              protocol: TCP
            {{- if or .Values.webConsole.enableHttps .Values.clustering.enabled }}
            - name: web-https
              containerPort: {{ .Values.webConsole.httpsPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.serviceDot.enabled }}
            - name: dns-tls
              containerPort: 853
              protocol: TCP
            - name: dns-quic
              containerPort: 853
              protocol: UDP
            {{- end }}
            {{- if .Values.serviceDoh.enabled }}
            - name: doh-https
              containerPort: 443
              protocol: TCP
            - name: doh-http
              containerPort: 80
              protocol: TCP
            {{- if .Values.serviceDoh.reverseProxy.enabled }}
            - name: doh-proxy
              containerPort: {{ .Values.serviceDoh.reverseProxy.port }}
              protocol: TCP
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/dns
        {{- if and .Values.clustering.enabled .Values.clustering.ipSync.enabled (not .Values.clustering.hostNetwork) (gt (int .Values.replicaCount) 1) .Values.admin.enabled (or .Values.admin.password .Values.admin.existingSecret) }}
        # Keeps this node's registered cluster IPs at "<per-pod Service ClusterIP>,<pod IP>".
        # Technitium checks the source IP of NOTIFY/zone-transfer traffic against
        # the registered IPs, and a pod's traffic comes from its pod IP, which
        # changes on every restart. The ClusterIP stays reachable for inbound calls.
        - name: cluster-ip-sync
          image: {{ .Values.clustering.ipSync.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "technitium-dns.password-secret" . }}
                  key: password
            - name: NODE_SERVICE_PREFIX
              value: "{{ include "technitium-dns.fullname" . }}-node"
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: API_URL
              value: "http://127.0.0.1:{{ .Values.webConsole.httpPort }}"
            - name: INTERVAL
              value: {{ .Values.clustering.ipSync.intervalSeconds | quote }}
          command:
            - /bin/sh
            - -c
            - |
              ordinal="${POD_NAME##*-}"
              svc="$NODE_SERVICE_PREFIX-$ordinal.$NAMESPACE.svc.cluster.local"
              token=""
              login() {
                token=$(curl -s -m15 "$API_URL/api/user/login" --data-urlencode user=admin \
                  --data-urlencode pass="$ADMIN_PASSWORD" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
              }
              echo "cluster-ip-sync: watching $POD_NAME (pod IP $POD_IP, service $svc)"
              while true; do
                cip=$(nslookup "$svc" 2>/dev/null | awk '/^Address: /{print $2}' | tail -1)
                [ -z "$token" ] && login
                state=""
                [ -n "$token" ] && state=$(curl -s -m15 "$API_URL/api/admin/cluster/state" --data-urlencode token="$token")
                if ! echo "$state" | grep -q '"status":"ok"'; then
                  token=""   # API not up yet or session expired; log in again next round
                elif ! echo "$state" | grep -q '"clusterInitialized":true'; then
                  :          # not clustered (yet): nothing to keep in sync
                elif [ -z "$cip" ]; then
                  echo "cluster-ip-sync: cannot resolve $svc, retrying"
                else
                  want="$cip,$POD_IP"
                  self=$(echo "$state" | tr '{' '\n' | grep '"state":"Self"')
                  have=$(echo "$self" | sed -n 's/.*"ipAddresses":\[\([^]]*\)\].*/\1/p' | tr -d '"')
                  # The node's own view can be right while the primary never got the
                  # change (a secondary pushes it once; if the primary is restarting at
                  # that moment the push is lost). The cluster zone, served from the
                  # primary's data, shows what the rest of the cluster believes.
                  name=$(echo "$self" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
                  zone=$(nslookup "$name" 127.0.0.1 2>/dev/null | awk '/^Address: /{print $2}' | grep -v ':53$' | sort | tr '\n' ',')
                  wantsorted=$(echo "$want" | tr ',' '\n' | sort | tr '\n' ',')
                  now=$(date +%s)
                  if [ "$have" != "$want" ] || { [ -n "$zone" ] && [ "$zone" != "$wantsorted" ] && [ $((now - ${last:-0})) -ge 120 ]; }; then
                    r=$(curl -s -m30 "$API_URL/api/admin/cluster/updateIpAddress" \
                      --data-urlencode token="$token" --data-urlencode ipAddresses="$want")
                    last=$now
                    echo "cluster-ip-sync: $(date -u +%FT%TZ) registered ${have:-none} (cluster zone: ${zone:-?}) -> $want: $(echo "$r" | grep -o '"status":"[a-z]*"')"
                  fi
                fi
                sleep "$INTERVAL"
              done
          {{- with .Values.clustering.ipSync.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: config
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- else if and .Values.persistence.enabled .Values.persistence.existingClaim }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
  {{- else }}
      volumes:
        - name: config
          emptyDir: {}
  {{- end }}

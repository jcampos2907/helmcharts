{{- if .Values.rsshub.enabled }}
# RSSHub runs as a second container in the analytics pod (see analytics.yaml); this ConfigMap carries its
# entrypoint script, a copy of infra/rsshub/entrypoint.sh in the umbrella repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ravenhold.fullname" . }}-rsshub-entrypoint
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "rsshub") | nindent 4 }}
data:
  entrypoint.sh: |
    {{- .Files.Get "files/rsshub-entrypoint.sh" | nindent 4 }}
{{- end }}

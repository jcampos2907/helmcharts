apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ravenhold.fullname" . }}-migrate
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "migrations") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ravenhold.migrationsImage" . }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          args: ["--migrate-only"]
          env:
            {{- include "ravenhold.apiEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

# Exactly one scheduler: replicas is fixed and the strategy is Recreate so an upgrade never overlaps two pods.
# The pod's own ServiceAccount has no API token mounted; the federation token below is a separate projected volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ravenhold.analyticsServiceAccountName" . }}
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "analytics") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravenhold.fullname" . }}-analytics
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "analytics") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "analytics") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "analytics") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ravenhold.analyticsServiceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: analytics
          image: {{ include "ravenhold.image" (dict "image" .Values.analytics.image "ctx" . "component" "analytics") }}
          imagePullPolicy: {{ .Values.analytics.image.pullPolicy }}
          env:
            {{- include "ravenhold.analyticsEnv" . | nindent 12 }}
            {{- if .Values.rsshub.enabled }}
            - name: RSSHUB_URL
              value: http://127.0.0.1:1200
            {{- end }}
            {{- include "ravenhold.analyticsIbEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.analytics.existingSecret }}
          volumeMounts:
            - name: cache
              mountPath: /home/app/.cache/stocktracker
            # Holds the KILL switch file that stops new paper orders.
            - name: state
              mountPath: /home/app/.stocktracker
            # The job rsshub-token-sync writes the X auth_token file here. It stays mounted when rsshub is off,
            # so the every-minute job writes harmlessly instead of logging an error each minute.
            - name: rsshub-token
              mountPath: /run/rsshub
            {{- if .Values.analytics.anthropicFederation.enabled }}
            {{- include "ravenhold.anthropicFederationMount" . | nindent 12 }}
            {{- end }}
          {{- with .Values.analytics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.rsshub.enabled }}
        # RSSHub reads its X token only from the environment at start. The entrypoint exports it from the shared
        # file and exits when the file changes; the kubelet restarts the container with the new token.
        - name: rsshub
          image: {{ .Values.rsshub.image.repository }}:{{ .Values.rsshub.image.tag }}
          imagePullPolicy: {{ .Values.rsshub.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/entrypoint.sh"]
          ports:
            - name: http
              containerPort: 1200
          env:
            {{- range $k, $v := .Values.rsshub.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if .Values.rsshub.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.rsshub.existingSecret }}
                optional: true
          {{- end }}
          volumeMounts:
            - name: rsshub-token
              mountPath: /run/rsshub
              readOnly: true
            - name: rsshub-entrypoint
              mountPath: /scripts
              readOnly: true
          {{- with .Values.rsshub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: state
          emptyDir: {}
        # Shared by analytics (writes) and rsshub (reads); memory-backed so the token never reaches a disk.
        - name: rsshub-token
          emptyDir:
            medium: Memory
        {{- if .Values.analytics.anthropicFederation.enabled }}
        # Kubernetes projected service-account token for Anthropic workload identity federation; the kubelet
        # rotates it and the SDK re-reads the file.
        {{- include "ravenhold.anthropicFederationVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.rsshub.enabled }}
        - name: rsshub-entrypoint
          configMap:
            name: {{ include "ravenhold.fullname" . }}-rsshub-entrypoint
        {{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravenhold.fullname" . }}-api
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "ravenhold.image" (dict "image" .Values.api.image "ctx" .) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # The migration Job owns the schema; replicas must not race to migrate.
            - name: Migrations__RunOnBoot
              value: "false"
            {{- include "ravenhold.apiEnv" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ravenhold.fullname" . }}-api
  labels:
    {{- include "ravenhold.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "ravenhold.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http

# Ravenhold chart values.
# This chart ships NO database and NO credentials: every secret comes from an existing Secret that you create
# (for example through the Vault Secrets Operator). Each component names its Secret in `existingSecret`; every key
# of that Secret becomes an environment variable of the container (envFrom), so key names are the variable names.

nameOverride: ""
fullnameOverride: ""

# Pull secret for the private registry (a kubernetes.io/dockerconfigjson Secret you create), e.g. [{name: ravenhold-registry}].
imagePullSecrets: []

# The registry every Ravenhold image comes from: <registry>/<component> (api, frontend, docs, analytics).
# The default is the owner's tailnet-only registry on nacho-3; a component's image.repository overrides it.
registry: nacho-3.tail4f4c7b.ts.net/ravenhold

# PostgreSQL (with the vector and pg_trgm extensions). With `existingSecret` set (for example the `<cluster>-app` Secret
# a CloudNativePG Cluster creates, keys `username` and `password`), the chart builds ConnectionStrings__Default for the
# api and migration Job and DATABASE_URL for analytics. Leave it empty to put those variables in the component Secrets.
database:
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  host: ""
  port: 5432
  name: ravenhold
  sslMode: prefer

# Empty image tags fall back to the Chart appVersion. CI pins each component's tag (the commit it was built from).

api:
  image:
    repository: ""   # empty: <registry>/api
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Secret keys read by the API: ConnectionStrings__Default (PostgreSQL with pgvector), Auth__AllowedSubjects__0,
  # Encryption__ActiveMasterKeyId, Encryption__MasterKeys__<id>, GatewayScreen__{Live,Paper}__VncPassword (optional).
  existingSecret: ravenhold-api
  # Plain configuration. The API refuses to start outside Development without an authority and an allow-list.
  env:
    Auth__Authority: ""      # your OIDC issuer, e.g. the homelab Keycloak realm URL
    Auth__Audience: ravenhold
  resources: {}

frontend:
  image:
    repository: ""   # empty: <registry>/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Secret keys read by the frontend: SESSION_SECRET (long random string that encrypts the session cookies).
  existingSecret: ravenhold-frontend
  # API_URL is not set here: the templates point it at the in-cluster api Service.
  env:
    OIDC_ISSUER: ""
    OIDC_CLIENT_ID: ravenhold
    OIDC_REDIRECT_URI: https://ravenhold.famcr.org/auth/callback
    OIDC_SCOPE: openid profile email
  resources: {}

docs:
  image:
    repository: ""   # empty: <registry>/docs
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # The docs site is static and holds no secret.
  env: {}
  resources: {}

analytics:
  image:
    repository: ""   # empty: <registry>/analytics
    tag: ""
    pullPolicy: IfNotPresent
  # No replicaCount value on purpose: the scheduler is always exactly 1 replica with the Recreate strategy. Two
  # schedulers against one database would duplicate every job and could double paper orders.
  # Secret keys read by analytics: DATABASE_URL, ANTHROPIC_API_KEY, SEC_USER_AGENT, Encryption__ActiveMasterKeyId,
  # Encryption__MasterKeys__<id>, and any other variable listed in analytics/.env.example.
  existingSecret: ravenhold-analytics
  # Paper trading stays off until you flip TRADING_ENABLED; limits have no default (a blank one stops `trading run`).
  # RSSHUB_URL and IBKR_*_HOST/PORT are filled in by the templates from the rsshub and ibGateway blocks.
  env:
    TZ: America/New_York
    TRADING_ENABLED: "false"
    TRADING_MODE: propose
  resources: {}
  # Claude through Anthropic workload identity federation instead of a static ANTHROPIC_API_KEY. When enabled, the
  # pod gets a projected service-account token and the SDK exchanges it for short-lived access tokens. Create the
  # federation rule (fdrl_...) in the Anthropic Console with this cluster's issuer and this ServiceAccount as subject.
  # An ANTHROPIC_API_KEY in the analytics secret still takes precedence.
  anthropicFederation:
    enabled: false
    ruleId: ""            # ANTHROPIC_FEDERATION_RULE_ID (fdrl_...)
    organizationId: ""    # ANTHROPIC_ORGANIZATION_ID (uuid)
    serviceAccountId: ""  # optional ANTHROPIC_SERVICE_ACCOUNT_ID
    workspaceId: ""       # optional ANTHROPIC_WORKSPACE_ID
    audience: https://api.anthropic.com
    expirationSeconds: 3600

# The migration Job: a pre-install/pre-upgrade hook that runs the API image with --migrate-only and exits. The API
# Deployment sets Migrations__RunOnBoot=false, so replicas never race to migrate. It reads the api existingSecret
# (connection string and master keys), so it needs no secret of its own.
migrations:
  image:
    repository: ""   # empty: the api image (repository and tag)
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 2
  resources: {}

# RSSHub turns X accounts into feeds that analytics ingests. It is a second container in the analytics pod, not a
# Deployment of its own: pods cannot share an emptyDir, and the analytics job rsshub-token-sync writes the X
# auth_token (saved in Settings > Connections) to a file on one. RSSHub's entrypoint exports it at start and exits
# when the file changes, so the kubelet restarts it with the new token. It inherits the analytics pod's Recreate
# strategy and single replica. Analytics reaches it at http://127.0.0.1:1200.
rsshub:
  enabled: true
  image:
    repository: diygod/rsshub
    tag: "2026-10-27"
    pullPolicy: IfNotPresent
  # Optional legacy Secret (TWITTER_AUTH_TOKEN); the token now comes from the vault. Leave empty to skip it.
  existingSecret: ""
  env:
    NODE_ENV: production
    CACHE_TYPE: memory
    CACHE_EXPIRE: "600"
  resources: {}

# IB Gateway, headless. Both are off by default so empty credentials never trigger repeated failed logins.
# Secret keys: TWS_USERID, TWS_PASSWORD, and optionally VNC_SERVER_PASSWORD.
ibGateway:
  live:
    enabled: false
    image:
      repository: gnzsnz/ib-gateway
      tag: "10.50.1f"
      pullPolicy: IfNotPresent
    existingSecret: ravenhold-ib-gateway
    # The live session must stay READ_ONLY_API=yes: IB itself then rejects any order.
    env:
      TRADING_MODE: live
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:45 PM"
      EXISTING_SESSION_DETECTED_ACTION: primary
      TWS_ACCEPT_INCOMING: accept
      TIME_ZONE: America/New_York
      TZ: America/New_York
    resources: {}
  paper:
    enabled: false
    image:
      repository: gnzsnz/ib-gateway
      tag: "10.50.1f"
      pullPolicy: IfNotPresent
    existingSecret: ravenhold-ib-gateway-paper
    env:
      TRADING_MODE: paper
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      AUTO_RESTART_TIME: "11:50 PM"
      EXISTING_SESSION_DETECTED_ACTION: primary
      TWS_ACCEPT_INCOMING: accept
      TIME_ZONE: America/New_York
      TZ: America/New_York
    resources: {}

# The per-user IB Gateway controller (off by default). When enabled it runs `gateways reconcile --every <interval>` from
# the analytics image with its own ServiceAccount, a namespaced Role (deployments, services, secrets) and an admission
# policy that only lets it write objects labelled ravenhold.famcr.org/managed-by=gateway-controller. The policy needs
# Kubernetes 1.30+. The static ibGateway pair above keeps working beside it; see deploy/helm/README.md to retire it.
gatewayController:
  enabled: false
  image:
    repository: ""   # empty: <registry>/analytics
    tag: ""
    pullPolicy: IfNotPresent
  interval: 15       # seconds between passes (a gateway_pair notification also triggers one)
  existingSecret: ""   # empty: analytics.existingSecret (DATABASE_URL, Encryption__*)
  resources: {}
  # What each user's gateway pods look like (GATEWAY_* variables of the controller).
  gateway:
    image:
      repository: gnzsnz/ib-gateway
      tag: "10.50.1f"
      pullPolicy: IfNotPresent
    resources: {}
    extraEnv: {}   # added to both gateways of every pair
    liveEnv: {}
    paperEnv: {}

# Ingress: ravenhold host serves `/` from the frontend and `/gateway-screen` (WebSocket) from the api;
# the docs host serves the docs site. Add `tls` entries when cert-manager issues the certificates.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: ravenhold.famcr.org
  docsHost: docs.ravenhold.famcr.org
  tls: []
  #  - secretName: ravenhold-tls
  #    hosts:
  #      - ravenhold.famcr.org
  #      - docs.ravenhold.famcr.org
